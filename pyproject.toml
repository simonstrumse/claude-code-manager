[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-code-manager"
version = "2.0.0"
description = "Terminal UI for managing Claude Code configurations across all your projects"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = [
    "textual>=0.47.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
ccmanager = "mcp_tui:main"
claude-code-manager = "mcp_tui:main"

[tool.setuptools]
py-modules = ["mcp_tui", "mcp_scanner", "mcp_data", "mcp_config", "mcp_operations"]

[tool.black]
line-length = 100
target-version = ['py36', 'py37', 'py38', 'py39', 'py310', 'py311']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.mypy]
python_version = "3.6"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true